<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Cats vs Dogs - Result</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main class="card">
    <h1>Result</h1>

    <p><b>File:</b> {{ filename }}</p>

    <div class="result">
      <div class="badge">
        Prediction: <b>{{ result.class }}</b>
      </div>
      <div class="muted">
        Confidence: {{ '%.2f'|format(result.confidence * 100) }}%
      </div>
    </div>

    <h3>Probabilities</h3>
    <ul class="list">
      {% for k,v in result.probs.items() %}
        <li><span>{{ k }}</span><span>{{ '%.2f'|format(v * 100) }}%</span></li>
      {% endfor %}
    </ul>

    <a class="link" href="/">← Try another image</a>
  </main>
</body>
</html>
